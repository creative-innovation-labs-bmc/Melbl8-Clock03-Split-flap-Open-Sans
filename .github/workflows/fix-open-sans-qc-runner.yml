name: Repair Open Sans QC runner

on:
  push:
    paths:
      - '.github/workflows/fix-open-sans-qc-runner.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image analysis dependency and retrigger QC
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/open-sans-v2-qc.yml')
          text=p.read_text()
          needle='          npm install --no-save playwright@1.55.0 >/dev/null 2>&1\n'
          replacement=needle+'          python3 -m pip install --quiet pillow\n'
          if 'pip install --quiet pillow' not in text:
              if needle not in text:
                  raise SystemExit('Could not locate Playwright install line')
              text=text.replace(needle,replacement,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/fix-open-sans-qc-runner.yml
          git config user.name 'creative-innovation-labs-bmc'
          git config user.email 'creative-innovation-labs-bmc@users.noreply.github.com'
          git add -A
          git commit -m 'Repair Open Sans pixel QC dependency'
          git push
