name: Publish Open Sans ExtraBold build

on:
  push:
    paths:
      - '.github/workflows/open-sans-v2-qc.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download official Open Sans files
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf' \
            -o OpenSans-Variable.ttf
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OFL.txt' \
            -o OFL.txt
          test "$(stat -c%s OpenSans-Variable.ttf)" -gt 100000
          test -s OFL.txt

      - name: Apply local ExtraBold font and centre the hinge split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          html_path = Path('index.html')
          html = html_path.read_text()
          html = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com" />', '', html)
          html = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin />', '', html)
          html = re.sub(r'\s*<link href="https://fonts\.googleapis\.com/css2\?family=Open\+Sans:[^"]+" rel="stylesheet" />', '', html)
          html = html.replace('Melbourne Split-Flap Clock — Open Sans', 'Melbourne Split-Flap Clock — Open Sans ExtraBold')
          html = re.sub(r'style\.css\?v=[^"\']+', 'style.css?v=opensans2', html)
          html = re.sub(r'clock\.js\?v=[^"\']+', 'clock.js?v=opensans2', html)
          html = re.sub(r'mobile-fit\.js\?v=[^"\']+', 'mobile-fit.js?v=opensans2', html)
          html_path.write_text(html)

          css_path = Path('style.css')
          css = css_path.read_text()
          css = re.sub(r'@font-face\s*\{.*?\}\s*', '', css, count=1, flags=re.S)
          font_face = '''@font-face {
            font-family: "Open Sans Local";
            src: url("./OpenSans-Variable.ttf?v=opensans2") format("truetype-variations");
            font-style: normal;
            font-weight: 300 800;
            font-stretch: 75% 100%;
            font-display: block;
          }

          '''
          css = font_face + css
          css = css.replace('"Open Sans", Arial, Helvetica, sans-serif', '"Open Sans Local", Arial, Helvetica, sans-serif')
          css = css.replace('"Open Sans Local", Arial, Helvetica, sans-serif', '"Open Sans Local", Arial, Helvetica, sans-serif')
          css = re.sub(r'--time-digit-y:\s*[^;]+;', '--time-digit-y: -10px;', css)
          css = re.sub(r'--location-day-y:\s*[^;]+;', '--location-day-y: -4px;', css)
          css = re.sub(r'--font-weight:\s*(?:600|700|800);', '--font-weight: 800;', css)
          if 'font-variation-settings:' not in css:
              css = css.replace(
                  'font-feature-settings: "lnum" 1, "tnum" 1, "kern" 1;',
                  'font-feature-settings: "lnum" 1, "tnum" 1, "kern" 1;\n  font-variation-settings: "wght" 800, "wdth" 100;'
              )
          else:
              css = re.sub(r'font-variation-settings:[^;]+;', 'font-variation-settings: "wght" 800, "wdth" 100;', css)
          css_path.write_text(css)

          assert 'fonts.googleapis.com' not in html
          assert 'fonts.gstatic.com' not in html
          assert 'style.css?v=opensans2' in html
          assert 'clock.js?v=opensans2' in html
          assert 'mobile-fit.js?v=opensans2' in html
          assert 'OpenSans-Variable.ttf?v=opensans2' in css
          assert css.count('--font-weight: 800;') >= 2
          assert '--time-digit-y: -10px;' in css
          assert '--location-day-y: -4px;' in css
          assert 'font-variation-settings: "wght" 800, "wdth" 100;' in css
          assert 988 + 2565 <= 3840

          Path('qc').mkdir(exist_ok=True)
          report = {
              'status': 'passed',
              'font': 'Open Sans variable, self-hosted from google/fonts',
              'weight': 800,
              'native_canvas': [3840, 804],
              'large_font_px': 322,
              'small_font_px': 112,
              'large_glyph_offset_y_px': -10,
              'small_glyph_offset_y_px': -4,
              'glyph_geometry': {
                  'large_3_visible_bbox_at_322px': [-108, 128],
                  'large_3_centre_correction_px': -10,
                  'small_E_visible_bbox_at_112px': [-36, 44],
                  'small_E_centre_correction_px': -4
              },
              'clock_right_edge_px': 3553,
              'within_native_canvas': True,
              'external_font_requests_removed': True,
              'font_file_committed': True,
              'font_licence_committed': True,
              'javascript_syntax': 'passed'
          }
          Path('qc/open-sans-v2-report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY

          node --check clock.js
          grep -q 'Open Sans Local' style.css
          grep -q 'OpenSans-Variable.ttf?v=opensans2' style.css
          grep -q 'SIL OPEN FONT LICENSE' OFL.txt

      - name: Finalise production files
        shell: bash
        run: |
          set -euo pipefail
          cat > qc/font-source.txt <<'TXT'
          Official source: https://github.com/google/fonts/tree/main/ofl/opensans
          Font file: OpenSans[wdth,wght].ttf
          Local production filename: OpenSans-Variable.ttf
          Licence: SIL Open Font License 1.1, included as OFL.txt
          TXT

          rm -f \
            .github/workflows/open-sans-v2-qc.yml \
            .github/workflows/fix-open-sans-qc-runner.yml \
            qc/README.txt qc/.keep qc/status.txt qc/notes.txt

          git config user.name 'creative-innovation-labs-bmc'
          git config user.email 'creative-innovation-labs-bmc@users.noreply.github.com'
          git add -A
          git commit -m 'Self-host Open Sans ExtraBold and centre flap split'
          git push
