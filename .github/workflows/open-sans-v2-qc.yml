name: Apply Open Sans v2 and QC

on:
  push:
    paths:
      - '.github/workflows/open-sans-v2-qc.yml'

permissions:
  contents: write

jobs:
  build-and-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download official Open Sans font and licence
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf' \
            -o OpenSans-Variable.ttf
          curl -fL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OFL.txt' \
            -o OFL.txt
          test -s OpenSans-Variable.ttf
          test -s OFL.txt

      - name: Apply local font and centre glyph split
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text()
          html = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com" />', '', html)
          html = re.sub(r'\s*<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin />', '', html)
          html = re.sub(r'\s*<link href="https://fonts\.googleapis\.com/css2\?family=Open\+Sans:[^"]+" rel="stylesheet" />', '', html)
          html = html.replace('style.css?v=opensans1', 'style.css?v=opensans2')
          html = html.replace('clock.js?v=opensans1', 'clock.js?v=opensans2')
          html = html.replace('mobile-fit.js?v=opensans1', 'mobile-fit.js?v=opensans2')
          html_path.write_text(html)

          css_path = Path('style.css')
          css = css_path.read_text()
          font_face = '''@font-face {
            font-family: "Open Sans Local";
            src: url("./OpenSans-Variable.ttf?v=opensans2") format("truetype-variations");
            font-style: normal;
            font-weight: 300 800;
            font-stretch: 75% 100%;
            font-display: block;
          }

          '''
          if '@font-face' not in css:
            css = font_face + css
          css = css.replace('"Open Sans", Arial, Helvetica, sans-serif', '"Open Sans Local", Arial, Helvetica, sans-serif')
          css = css.replace('--time-digit-y: 16px;', '--time-digit-y: -10px;')
          css = css.replace('--location-day-y: 4px;', '--location-day-y: -4px;')
          css = css.replace('--font-weight: 700;', '--font-weight: 800;')
          css = css.replace('--font-weight: 600;', '--font-weight: 800;')
          css = css.replace('font-feature-settings: "lnum" 1, "tnum" 1, "kern" 1;', 'font-feature-settings: "lnum" 1, "tnum" 1, "kern" 1;\n  font-variation-settings: "wght" 800, "wdth" 100;')
          css_path.write_text(css)

          assert 'fonts.googleapis.com' not in html
          assert 'OpenSans-Variable.ttf?v=opensans2' in css
          assert '--time-digit-y: -10px' in css
          assert '--location-day-y: -4px' in css
          assert css.count('--font-weight: 800') >= 2
          PY

      - name: Prepare browser QC
        run: |
          cat > qc-split.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css?v=opensans2">
          <style>
          html,body{width:760px;height:550px;margin:0;background:#1C1B1C;overflow:hidden}
          body{position:relative}
          #big3{position:absolute;left:40px;top:40px}
          #smallE{position:absolute;left:500px;top:165px}
          </style></head><body>
          <div class="flap big" id="big3">
            <div class="panel top"><span>3</span></div><div class="panel bottom"><span>3</span></div>
            <div class="flip-half top-flip"><span>3</span></div><div class="flip-half bottom-flip"><span>3</span></div>
          </div>
          <div class="flap small" id="smallE">
            <div class="panel top"><span>E</span></div><div class="panel bottom"><span>E</span></div>
            <div class="flip-half top-flip"><span>E</span></div><div class="flip-half bottom-flip"><span>E</span></div>
          </div>
          </body></html>
          HTML

          cat > qc-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:3840,height:804}, deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/?noboot=1&build=opensans2',{waitUntil:'networkidle'});
          await page.evaluate(()=>document.fonts.ready);
          const production = await page.evaluate(()=>{
            const stage=document.querySelector('#stage').getBoundingClientRect();
            const flaps=[...document.querySelectorAll('.flap')].map(el=>{
              const r=el.getBoundingClientRect(); return {left:r.left,top:r.top,right:r.right,bottom:r.bottom};
            });
            const fontLoaded=document.fonts.check('800 100px "Open Sans Local"');
            const resources=performance.getEntriesByType('resource').map(x=>x.name);
            return {stage:{width:stage.width,height:stage.height},flaps,fontLoaded,resources};
          });
          await page.screenshot({path:'qc/open-sans-v2-native.png'});

          const split=await browser.newPage({viewport:{width:760,height:550},deviceScaleFactor:1});
          await split.goto('http://127.0.0.1:4173/qc-split.html',{waitUntil:'networkidle'});
          await split.evaluate(()=>document.fonts.ready);
          await split.screenshot({path:'qc/open-sans-v2-split.png'});

          await browser.close();
          fs.writeFileSync('qc/browser-data.json',JSON.stringify({production,errors},null,2));
          if(!production.fontLoaded) throw new Error('Self-hosted Open Sans did not load');
          if(production.stage.width!==3840 || production.stage.height!==804) throw new Error('Native stage size changed');
          if(production.flaps.some(r=>r.left<0 || r.top<0 || r.right>3840 || r.bottom>804)) throw new Error('A flap falls outside the native stage');
          if(production.resources.some(url=>url.includes('fonts.googleapis.com') || url.includes('fonts.gstatic.com'))) throw new Error('External Google font request remains');
          if(errors.length) throw new Error(`Browser errors: ${errors.join('; ')}`);
          JS

          cat > qc-pixels.py <<'PY'
          from PIL import Image
          import json
          from pathlib import Path

          image=Image.open('qc/open-sans-v2-split.png').convert('RGB')
          tests={
            'big_3': {'box':(40,40,390,510),'hinge':275},
            'small_E': {'box':(500,165,670,385),'hinge':275},
          }
          report={}
          for name,item in tests.items():
            x1,y1,x2,y2=item['box']; hinge=item['hinge']
            points=[]
            for y in range(y1,y2):
              for x in range(x1,x2):
                r,g,b=image.getpixel((x,y))
                if r>225 and g>225 and b>225:
                  points.append((x,y))
            if not points:
              raise SystemExit(f'No white glyph pixels found for {name}')
            ys=[p[1] for p in points]
            top_near=sum(1 for x,y in points if hinge-10 <= y <= hinge-3)
            bottom_near=sum(1 for x,y in points if hinge+3 <= y <= hinge+10)
            bbox_center=(min(ys)+max(ys))/2
            centre_offset=bbox_center-hinge
            edge_touch=any(x<=x1+4 or x>=x2-5 or y<=y1+4 or y>=y2-5 for x,y in points)
            report[name]={
              'white_pixels':len(points),
              'near_hinge_top':top_near,
              'near_hinge_bottom':bottom_near,
              'glyph_bbox_y':[min(ys),max(ys)],
              'glyph_centre_offset_px':centre_offset,
              'edge_touch':edge_touch,
            }
            if top_near < 8 or bottom_near < 8:
              raise SystemExit(f'{name} does not cross both sides of the hinge: {report[name]}')
            if abs(centre_offset)>6:
              raise SystemExit(f'{name} visual centre is not aligned to hinge: {report[name]}')
            if edge_touch:
              raise SystemExit(f'{name} is clipped at a tile edge: {report[name]}')
          Path('qc/open-sans-v2-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

      - name: Run Chromium QC
        run: |
          set -euo pipefail
          mkdir -p qc
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/open-sans-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node qc-browser.mjs
          python3 qc-pixels.py
          node --check clock.js
          test "$(stat -c%s OpenSans-Variable.ttf)" -gt 100000

      - name: Commit production update and QC
        run: |
          set -euo pipefail
          rm -f qc-split.html qc-browser.mjs qc-pixels.py package.json package-lock.json
          rm -rf node_modules
          rm -f .github/workflows/open-sans-v2-qc.yml
          git config user.name 'creative-innovation-labs-bmc'
          git config user.email 'creative-innovation-labs-bmc@users.noreply.github.com'
          git add -A
          git commit -m 'Self-host Open Sans ExtraBold and centre flap split'
          git push
