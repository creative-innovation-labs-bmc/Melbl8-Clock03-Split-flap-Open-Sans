name: Render Open Sans v2 QC

on:
  push:
    paths:
      - '.github/workflows/render-open-sans-v2-qc.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Create hinge test page
        run: |
          cat > qc-split.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css?v=opensans2">
          <style>
            html,body{width:800px;height:560px;margin:0;background:#1C1B1C;overflow:hidden}
            body{position:relative}
            #big3{position:absolute;left:50px;top:40px}
            #smallE{position:absolute;left:530px;top:165px}
          </style></head><body>
            <div class="flap big" id="big3">
              <div class="panel top"><span>3</span></div>
              <div class="panel bottom"><span>3</span></div>
              <div class="flip-half top-flip"><span>3</span></div>
              <div class="flip-half bottom-flip"><span>3</span></div>
            </div>
            <div class="flap small" id="smallE">
              <div class="panel top"><span>E</span></div>
              <div class="panel bottom"><span>E</span></div>
              <div class="flip-half top-flip"><span>E</span></div>
              <div class="flip-half bottom-flip"><span>E</span></div>
            </div>
          </body></html>
          HTML

          cat > qc-render.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const errors=[];

          const main = await browser.newPage({viewport:{width:3840,height:804},deviceScaleFactor:1});
          main.on('pageerror',e=>errors.push(String(e)));
          await main.goto('http://127.0.0.1:4173/?noboot=1&build=opensans2',{waitUntil:'networkidle'});
          await main.evaluate(()=>document.fonts.ready);
          const production = await main.evaluate(()=>{
            const stage=document.querySelector('#stage').getBoundingClientRect();
            const flaps=[...document.querySelectorAll('.flap')].map(el=>{
              const r=el.getBoundingClientRect();
              return {left:r.left,top:r.top,right:r.right,bottom:r.bottom};
            });
            return {
              stage:{width:stage.width,height:stage.height},
              flapCount:flaps.length,
              allFlapsContained:flaps.every(r=>r.left>=0&&r.top>=0&&r.right<=3840&&r.bottom<=804),
              fontLoaded:document.fonts.check('800 100px "Open Sans Local"'),
              resources:performance.getEntriesByType('resource').map(x=>x.name)
            };
          });
          await main.screenshot({path:'qc/open-sans-v2-native.png'});

          const split = await browser.newPage({viewport:{width:800,height:560},deviceScaleFactor:1});
          split.on('pageerror',e=>errors.push(String(e)));
          await split.goto('http://127.0.0.1:4173/qc-split.html',{waitUntil:'networkidle'});
          await split.evaluate(()=>document.fonts.ready);
          await split.screenshot({path:'qc/open-sans-v2-split.png'});

          await browser.close();
          fs.writeFileSync('qc/browser-data.json',JSON.stringify({production,errors},null,2));
          JS

          cat > qc-pixels.py <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          image=Image.open('qc/open-sans-v2-split.png').convert('RGB')
          cases={
            'large_3':{'box':(50,40,400,510),'hinge':275},
            'small_E':{'box':(530,165,700,385),'hinge':275},
          }
          output={}
          for name,cfg in cases.items():
            x1,y1,x2,y2=cfg['box']; hinge=cfg['hinge']
            pixels=[]
            for y in range(y1,y2):
              for x in range(x1,x2):
                r,g,b=image.getpixel((x,y))
                if r>=220 and g>=220 and b>=220:
                  pixels.append((x,y))
            ys=[y for _,y in pixels]
            bbox=[min(ys),max(ys)] if ys else [None,None]
            visual_centre=(bbox[0]+bbox[1])/2 if ys else None
            above=sum(1 for _,y in pixels if hinge-14<=y<=hinge-3)
            below=sum(1 for _,y in pixels if hinge+3<=y<=hinge+14)
            output[name]={
              'white_pixel_count':len(pixels),
              'visible_bbox_y':bbox,
              'visual_centre_y':visual_centre,
              'hinge_y':hinge,
              'centre_offset_from_hinge_px':None if visual_centre is None else visual_centre-hinge,
              'pixels_above_hinge_band':above,
              'pixels_below_hinge_band':below,
              'crosses_hinge':above>0 and below>0,
            }
          browser=json.loads(Path('qc/browser-data.json').read_text())
          output['production']=browser
          output['passed']=(
            all(v['crosses_hinge'] and abs(v['centre_offset_from_hinge_px'])<=8 for k,v in output.items() if k in ('large_3','small_E'))
            and browser['production']['stage']=={'width':3840,'height':804}
            and browser['production']['allFlapsContained']
            and browser['production']['fontLoaded']
            and not browser['errors']
            and not any('fonts.googleapis.com' in u or 'fonts.gstatic.com' in u for u in browser['production']['resources'])
          )
          Path('qc/open-sans-v2-render-report.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          PY

      - name: Render and measure
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          python3 -m pip install --quiet pillow
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 4173 >/tmp/open-sans-qc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node qc-render.mjs
          python3 qc-pixels.py

      - name: Store QC and remove runner
        run: |
          set -euo pipefail
          rm -f qc-split.html qc-render.mjs qc-pixels.py package.json package-lock.json
          rm -rf node_modules
          rm -f .github/workflows/render-open-sans-v2-qc.yml
          git config user.name 'creative-innovation-labs-bmc'
          git config user.email 'creative-innovation-labs-bmc@users.noreply.github.com'
          git add -A
          git commit -m 'Store rendered Open Sans v2 QC'
          git push
